## rEFInd configuration - CapyDOS USB Multi-Boot
## FreeDOS Nativo + ReactOS Live

timeout 3
use_nvram false
scan_all_linux_kernels false
fold_linux_kernels false
scanfor manual

menuentry "CapyDOS Retro Games (FreeDOS 1.4 Nativo)" {
    icon     \EFI\BOOT\icons\os_freedos.png
    volume   FD14-FULL
    loader   \EFI\BOOT\CAPYBOOTX64.EFI
    options  ""
}

menuentry "ReactOS 0.4.16 Live (Windows Compatible - CSMWrap)" {
    icon     \EFI\BOOT\icons\os_reactos.png
    volume   FD14-FULL
    loader   \EFI\BOOT\ROSBOOT.EFI
    options  ""
}

menuentry "ReactOS 0.4.16 Live (GRUB4DOS RAMDisk ISO)" {
    icon     \EFI\BOOT\icons\os_reactos.png
    volume   FD14-FULL
    loader   \EFI\BOOT\GRUB4DOS.EFI
    options  ""
}

