[FREELOADER]
DefaultOS=LiveImg_P2
TimeOut=5

[Display]
TitleText=ReactOS 0.4.16 Live - CapyDOS
MinimalUI=No

[Operating Systems]
LiveImg_P2="ReactOS Live (Particion 2 Directo - Recomendado)"
Live_VGA="ReactOS Live (Modo VGA Seguro 640x480 - RAMDisk ISO)"
Live_SOS="ReactOS Live (Modo Diagnostico SOS en Pantalla)"
LiveImg_RamDisk="ReactOS Live (Modo Estandar RAMDisk)"

[LiveImg_P2]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(2)\REACTOS
Options=/FASTDETECT /MININT /BASEVIDEO /SOS

[Live_VGA]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH=multi(0)disk(0)rdisk(0)partition(2)\REACTOS\ISO\ReactOS-0.4.16-i386.iso /RDEXPORTASCD /BASEVIDEO /SOS

[Live_SOS]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH=multi(0)disk(0)rdisk(0)partition(2)\REACTOS\ISO\ReactOS-0.4.16-i386.iso /RDEXPORTASCD /BASEVIDEO /SOS /DEBUG /DEBUGPORT=SCREEN

[LiveImg_RamDisk]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH=multi(0)disk(0)rdisk(0)partition(2)\REACTOS\ISO\ReactOS-0.4.16-i386.iso /RDEXPORTASCD
